name: PAYTON_DAILY_RECEIPT
on:
  schedule:
    - cron: "3 2 * * *"   # ~04:03 Asia/Jerusalem ≈ 02:03 UTC (проверь летнее/зимнее)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily_receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Timestamp
        id: ts
        run: |
          TS_UTC="$(date -u +%Y-%m-%d__%H-%M-%S__UTC)"
          DAY_UTC="$(date -u +%Y-%m-%d)"
          echo "TS_UTC=$TS_UTC" >> $GITHUB_OUTPUT
          echo "DAY_UTC=$DAY_UTC" >> $GITHUB_OUTPUT

      - name: Write receipt (facts only)
        run: |
          mkdir -p evidence/daily
          f="evidence/daily/RECEIPT__${{ steps.ts.outputs.DAY_UTC }}__${{ steps.ts.outputs.TS_UTC }}.txt"
          cat > "$f" <<EOF
          🔴 RECEIPT · CI DAILY TICK (FACTS ONLY)
          SYSTEM: SoulInPsyAbstract
          SCOPE: REMOTE / CI
          MODE: LEGAL · FACTUAL
          EXECUTION_CONTEXT=CI
          RUNTIME=REMOTE
          CLAIMS=NONE

          RUN_ID=$GITHUB_RUN_ID
          RUN_NUMBER=$GITHUB_RUN_NUMBER
          COMMIT_SHA=$GITHUB_SHA
          TS_UTC=${{ steps.ts.outputs.TS_UTC }}

          FACTS:
          - This job executed in GitHub Actions as scheduled or manually dispatched.
          - This receipt is an append-only evidence artifact.
          - No intent, no interpretation, no external side effects recorded here.
          EOF
          echo "WROTE=$f" >> $GITHUB_ENV

      - name: Hash receipt
        run: |
          sha256sum "$WROTE" > "$WROTE.sha256"

      - name: Update manifest (append-only)
        run: |
          m="evidence/manifests/MANIFEST__DAILY__${{ steps.ts.outputs.DAY_UTC }}.tsv"
          mkdir -p evidence/manifests
          if [ ! -f "$m" ]; then
            echo -e "filename\tbytes\tsha256" > "$m"
          fi
          b="$(wc -c < "$WROTE" | tr -d ' ')"
          h="$(cut -d' ' -f1 < "$WROTE.sha256")"
          echo -e "$(basename "$WROTE")\t$b\t$h" >> "$m"
          sha256sum "$m" > "$m.sha256"

      - name: Check payload has not gone stale (cross-day duplicate detection)
        run: |
          # RUN_NUMBER only, not RUN_NUMBER+COMMIT_SHA. GITHUB_RUN_NUMBER is
          # guaranteed monotonic per-workflow by GitHub itself — it can only
          # repeat across two receipts if someone manually re-runs an old
          # failed job via "Re-run failed jobs" (same run_number, higher
          # run_attempt). That has never happened here (0/208 runs). Adding
          # COMMIT_SHA into the signature contributed zero extra detection
          # power for that case but did make the check fragile to hand
          # commits between scheduled runs — it fired false-positive twice
          # (2026-08-18 and again on the very fix commit for this, 2026-08-21)
          # because COMMIT_SHA in a receipt doesn't match the commit that
          # *added* the previous receipt when a human pushes by hand in
          # between. See dipankarsarkar's analysis, 2026-08-21: "RUN_NUMBER
          # has no such coupling because the counter belongs to the workflow,
          # not the branch. One column, not two."
          sig() { grep -E '^RUN_NUMBER=' "$1" | sha256sum | cut -d' ' -f1; }
          today_file="$WROTE"
          today_sig="$(sig "$today_file")"
          match=""
          for f in evidence/daily/RECEIPT__*.txt; do
            [ "$f" = "$today_file" ] && continue
            if [ "$(sig "$f")" = "$today_sig" ]; then
              match="$f"
              break
            fi
          done
          if [ -n "$match" ]; then
            echo "::error::Today's RUN_NUMBER signature matches $match — provenance did not advance, even though TS_UTC/RUN_ID differ."
            exit 1
          fi
          echo "OK: RUN_NUMBER signature ($today_sig) is new."

      - name: Check for RUN_NUMBER gap since last receipt (facts only, non-blocking)
        run: |
          # A gap means at least one run of this workflow between the last
          # receipt and this one produced no receipt — i.e. it failed before
          # the commit step. GITHUB_RUN_NUMBER is monotonic per-workflow by
          # GitHub's own guarantee, so a gap here is a hard sequential fact,
          # not an inference. This is the detector sig() never was: sig()
          # only catches duplicates (a case with zero historical instances),
          # never gaps (the case that has happened 3 times: runs 20, 164,
          # 204). Run 204 failed 2026-08-18 and left no receipt; run 205
          # (a manual dispatch 47.8 min later) silently covered that day's
          # date, and no code in this repo read the hole until now. See
          # dipankarsarkar's analysis, 2026-08-21.
          #
          # Non-blocking by design: a gap in PAST runs is not this run's
          # fault, and this run already succeeded — failing it would not
          # un-happen the earlier failure, only hide today's good receipt
          # behind a red X. The gap is recorded as evidence instead.
          count="$(ls -1 evidence/daily/RECEIPT__*.txt 2>/dev/null | wc -l)"
          if [ "$count" -lt 2 ]; then
            echo "Fewer than 2 receipts total — nothing to compare yet."
            exit 0
          fi
          prev_file="$(ls -1 evidence/daily/RECEIPT__*.txt | sort | tail -2 | head -1)"
          prev_run="$(grep '^RUN_NUMBER=' "$prev_file" | cut -d= -f2)"
          curr_run="$GITHUB_RUN_NUMBER"
          if [ -z "$prev_run" ]; then
            echo "Previous receipt ($prev_file) predates RUN_NUMBER tracking (pre-2026-08-17 format) — nothing to compare."
            exit 0
          fi
          gap=$((curr_run - prev_run - 1))
          if [ "$gap" -gt 0 ]; then
            mkdir -p evidence/gaps
            g="evidence/gaps/GAP__${{ steps.ts.outputs.DAY_UTC }}.txt"
            cat > "$g" <<EOF
          GAP DETECTED (facts only)
          prev_receipt=$prev_file
          prev_run_number=$prev_run
          curr_run_number=$curr_run
          missing_runs=$gap
          detected_at=${{ steps.ts.outputs.TS_UTC }}
          EOF
            sha256sum "$g" > "$g.sha256"
            echo "::warning::RUN_NUMBER gap detected: $gap run(s) between $prev_run and $curr_run produced no receipt (see $g)"
          else
            echo "OK: no RUN_NUMBER gap ($prev_run -> $curr_run)."
          fi

      - name: Commit evidence
        run: |
          git config user.name "payton-ci"
          git config user.email "payton-ci@users.noreply.github.com"
          git add evidence/daily evidence/manifests
          [ -d evidence/gaps ] && git add evidence/gaps
          git commit -m "evidence: daily receipt ${{ steps.ts.outputs.TS_UTC }}" || exit 0
          git push
