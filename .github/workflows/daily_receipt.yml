name: PAYTON_DAILY_RECEIPT
on:
  schedule:
    - cron: "3 2 * * *"   # ~04:03 Asia/Jerusalem ≈ 02:03 UTC (проверь летнее/зимнее)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily_receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Timestamp
        id: ts
        run: |
          TS_UTC="$(date -u +%Y-%m-%d__%H-%M-%S__UTC)"
          DAY_UTC="$(date -u +%Y-%m-%d)"
          echo "TS_UTC=$TS_UTC" >> $GITHUB_OUTPUT
          echo "DAY_UTC=$DAY_UTC" >> $GITHUB_OUTPUT

      - name: Write receipt (facts only)
        run: |
          mkdir -p evidence/daily
          f="evidence/daily/RECEIPT__${{ steps.ts.outputs.DAY_UTC }}__${{ steps.ts.outputs.TS_UTC }}.txt"
          cat > "$f" <<EOF
          🔴 RECEIPT · CI DAILY TICK (FACTS ONLY)
          SYSTEM: SoulInPsyAbstract
          SCOPE: REMOTE / CI
          MODE: LEGAL · FACTUAL
          EXECUTION_CONTEXT=CI
          RUNTIME=REMOTE
          CLAIMS=NONE

          RUN_ID=$GITHUB_RUN_ID
          RUN_NUMBER=$GITHUB_RUN_NUMBER
          COMMIT_SHA=$GITHUB_SHA
          TS_UTC=${{ steps.ts.outputs.TS_UTC }}

          FACTS:
          - This job executed in GitHub Actions as scheduled or manually dispatched.
          - This receipt is an append-only evidence artifact.
          - No intent, no interpretation, no external side effects recorded here.
          EOF
          echo "WROTE=$f" >> $GITHUB_ENV

      - name: Hash receipt
        run: |
          sha256sum "$WROTE" > "$WROTE.sha256"

      - name: Update manifest (append-only)
        run: |
          m="evidence/manifests/MANIFEST__DAILY__${{ steps.ts.outputs.DAY_UTC }}.tsv"
          mkdir -p evidence/manifests
          if [ ! -f "$m" ]; then
            echo -e "filename\tbytes\tsha256" > "$m"
          fi
          b="$(wc -c < "$WROTE" | tr -d ' ')"
          h="$(cut -d' ' -f1 < "$WROTE.sha256")"
          echo -e "$(basename "$WROTE")\t$b\t$h" >> "$m"
          sha256sum "$m" > "$m.sha256"

      - name: Check payload has not gone stale (cross-day duplicate detection)
        run: |
          # Compare only RUN_NUMBER + COMMIT_SHA, not the whole receipt. TS_UTC
          # (date -u with seconds) and RUN_ID (globally unique per run) differ on
          # every single execution by construction, so hashing the full file
          # masks the one case that actually matters: provenance itself failing
          # to advance while those two noise fields still tick over normally.
          # See dipankarsarkar's masking analysis, 2026-08-20: with the old
          # whole-file hash, 14 of 15 field-subset masks still passed — only
          # masking all 4 fields at once ever made the gate fire.
          sig() { grep -E '^(RUN_NUMBER|COMMIT_SHA)=' "$1" | sha256sum | cut -d' ' -f1; }
          today_file="$WROTE"
          today_sig="$(sig "$today_file")"
          match=""
          for f in evidence/daily/RECEIPT__*.txt; do
            [ "$f" = "$today_file" ] && continue
            if [ "$(sig "$f")" = "$today_sig" ]; then
              match="$f"
              break
            fi
          done
          if [ -n "$match" ]; then
            echo "::error::Today's RUN_NUMBER/COMMIT_SHA signature matches $match — provenance did not advance, even though TS_UTC/RUN_ID differ."
            exit 1
          fi
          echo "OK: RUN_NUMBER/COMMIT_SHA signature ($today_sig) is new."

      - name: Commit evidence
        run: |
          git config user.name "payton-ci"
          git config user.email "payton-ci@users.noreply.github.com"
          git add evidence/daily evidence/manifests
          git commit -m "evidence: daily receipt ${{ steps.ts.outputs.TS_UTC }}" || exit 0
          git push
